<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Chi tiết phiên đấu giá')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container page-wrap py-3"><div class="page-heading d-flex flex-wrap justify-content-between align-items-end gap-2"><div><span class="eyebrow">Chi tiết phiên</span><h1 class="h2 mt-2">Kết quả đã lưu</h1><code th:text="${auctionId}"></code></div><a class="btn btn-outline-secondary" th:href="@{/history}">← Về lịch sử</a></div><div class="card"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Thời gian</th><th>Từ khóa</th><th>Nhà quảng cáo</th><th>Bid</th><th>QS</th><th>Ad Rank</th><th>Vị trí</th><th>CPC</th><th>Hiển thị</th><th>CTR</th><th>Clicks</th><th>Cost</th><th>Ngân sách còn</th></tr></thead><tbody><tr th:each="r : ${rows}" th:classappend="${r.position == 1} ? 'rank-winner' : ''"><td th:text="${#temporals.format(r.simulatedAt,'dd/MM/yyyy HH:mm')}"></td><td th:text="${r.keyword}"></td><td th:text="${r.advertiser}"></td><td th:text="${r.bid}"></td><td th:text="${r.qualityScore}"></td><td th:text="${r.adRank}"></td><td th:text="${r.position}"></td><td th:text="${r.cpc}"></td><td th:text="${r.impressions}"></td><td th:text="${r.ctr} + '%'"></td><td th:text="${r.clicks}"></td><td th:text="${r.cost}"></td><td th:text="${r.remainingBudget}"></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="13" class="empty-state">Không tìm thấy phiên đấu giá này.</td></tr></tbody></table></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
