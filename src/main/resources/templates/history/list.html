<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Lịch sử đấu giá')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container page-wrap py-3"><div class="page-heading"><span class="eyebrow">Dữ liệu đã lưu</span><h1 class="h2 mt-2">Lịch sử mô phỏng</h1><p class="text-muted-custom">Lọc theo từ khóa, nhà quảng cáo và khoảng thời gian.</p></div><div th:replace="~{fragments/layout :: flash}"></div>
<form class="filter-bar row g-2 align-items-end mb-3" method="get"><div class="col-md-4"><label class="form-label">Từ khóa</label><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Nhập từ khóa"></div><div class="col-md-3"><label class="form-label">Nhà quảng cáo</label><select class="form-select" name="advertiserId"><option value="">Tất cả</option><option th:each="a : ${advertisers}" th:value="${a.id}" th:selected="${advertiserId == a.id}" th:text="${a.name}"></option></select></div><div class="col-6 col-md-2"><label class="form-label">Từ ngày</label><input class="form-control" type="date" name="from" th:value="${from}"></div><div class="col-6 col-md-2"><label class="form-label">Đến ngày</label><input class="form-control" type="date" name="to" th:value="${to}"></div><div class="col-md-1 d-grid"><button class="btn btn-primary">Lọc</button></div></form>
<div class="card"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Ngày giờ</th><th>Từ khóa</th><th>Nhà quảng cáo</th><th>Loại</th><th>Bid</th><th>QS</th><th>Ad Rank</th><th>Vị trí</th><th>CPC</th><th>Clicks</th><th>Cost</th><th></th></tr></thead><tbody><tr th:each="r : ${rows}"><td th:text="${#temporals.format(r.simulatedAt,'dd/MM/yyyy HH:mm')}"></td><td th:text="${r.keyword}"></td><td th:text="${r.advertiser}"></td><td><span class="badge text-bg-light" th:text="${r.simulationType == 'CAMPAIGN' ? 'Chiến dịch' : 'Đấu giá'}"></span></td><td th:text="${#numbers.formatDecimal(r.bid,1,'POINT',0,'COMMA')} + ' ₫'"></td><td th:text="${r.qualityScore}"></td><td th:text="${#numbers.formatDecimal(r.adRank,1,'POINT',2,'COMMA')}"></td><td th:text="${r.position}"></td><td th:text="${#numbers.formatDecimal(r.cpc,1,'POINT',0,'COMMA')} + ' ₫'"></td><td th:text="${r.clicks}"></td><td th:text="${#numbers.formatDecimal(r.cost,1,'POINT',0,'COMMA')} + ' ₫'"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/history/{id}(id=${r.auctionId})}">Chi tiết</a></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="12" class="empty-state">Không tìm thấy kết quả phù hợp.</td></tr></tbody></table></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
