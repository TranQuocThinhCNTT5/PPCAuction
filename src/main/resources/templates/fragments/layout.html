<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · PPC Auction Simulator'">PPC Auction Simulator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-xl navbar-dark app-navbar sticky-top">
  <div class="container-fluid px-lg-4">
    <a class="navbar-brand fw-bold" th:href="@{/}"><span class="brand-mark">P</span> PPC Auction Simulator</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Mở menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto gap-xl-1">
        <li class="nav-item"><a class="nav-link" th:href="@{/}">Trang chủ</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/auction}">Đấu giá</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/advertisers}">Nhà quảng cáo</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/keywords}">Từ khóa</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/campaigns}">Chiến dịch</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/campaign-simulator}">Mô phỏng ngày</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/history}">Lịch sử</a></li>
      </ul>
    </div>
  </div>
</nav>
<div th:fragment="flash" class="container pt-3">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert"><span th:text="${success}">Đã lưu.</span><button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button></div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert"><span th:text="${error}">Có lỗi.</span><button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button></div>
</div>
<footer th:fragment="footer" class="app-footer mt-5"><div class="container py-4 d-flex flex-column flex-md-row justify-content-between gap-2"><strong>PPC Auction Simulator</strong><span>Hệ thống mô phỏng đấu giá PPC/SEM phục vụ học tập.</span></div></footer>
<div th:fragment="scripts"><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script><script th:src="@{/js/app.js}"></script></div>
</body>
</html>
