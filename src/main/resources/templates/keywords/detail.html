<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Chi tiết từ khóa')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container page-wrap py-3"><div class="page-heading d-flex justify-content-between align-items-end"><div><span class="eyebrow">Từ khóa</span><h1 class="h2 mt-2" th:text="${item.phrase}"></h1></div><a class="btn btn-outline-primary" th:href="@{/keywords/{id}/edit(id=${item.id})}">Sửa từ khóa</a></div><div class="card p-4"><dl class="row mb-0"><dt class="col-sm-3">Lượt tìm kiếm / tháng</dt><dd class="col-sm-9" th:text="${item.searchVolume}"></dd><dt class="col-sm-3">Mức cạnh tranh</dt><dd class="col-sm-9" th:text="${item.competition}"></dd><dt class="col-sm-3">Quality Score</dt><dd class="col-sm-9" th:text="${item.qualityScore} + '/10'"></dd><dt class="col-sm-3">Trạng thái</dt><dd class="col-sm-9" th:text="${item.status == 'ACTIVE' ? 'Hoạt động' : 'Tạm dừng'}"></dd></dl></div><a class="btn btn-link mt-3" th:href="@{/keywords}">← Danh sách từ khóa</a></main><footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
