<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${pageTitle})}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container page-wrap py-3"><div class="page-heading"><span class="eyebrow">Từ khóa</span><h1 class="h2 mt-2" th:text="${pageTitle}"></h1></div><form th:action="@{/keywords}" th:object="${form}" method="post" class="card p-3 p-md-4"><input type="hidden" name="id" th:value="${id}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Cụm từ khóa *</label><input class="form-control" th:field="*{phrase}" required><div class="text-danger small" th:errors="*{phrase}"></div></div><div class="col-md-6"><label class="form-label">Lượt tìm kiếm ước tính / tháng</label><input class="form-control" type="number" min="0" th:field="*{searchVolume}"><div class="text-danger small" th:errors="*{searchVolume}"></div></div><div class="col-md-4"><label class="form-label">Mức cạnh tranh</label><select class="form-select" th:field="*{competition}"><option value="LOW">Thấp</option><option value="MEDIUM">Trung bình</option><option value="HIGH">Cao</option></select></div><div class="col-md-4"><label class="form-label">Quality Score (1–10)</label><input class="form-control" type="number" min="1" max="10" th:field="*{qualityScore}"><div class="text-danger small" th:errors="*{qualityScore}"></div></div><div class="col-md-4"><label class="form-label">Trạng thái</label><select class="form-select" th:field="*{status}"><option value="ACTIVE">Hoạt động</option><option value="PAUSED">Tạm dừng</option></select></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Lưu từ khóa</button><a class="btn btn-outline-secondary" th:href="@{/keywords}">Hủy</a></div></form></main><footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
