<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Từ khóa')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container page-wrap py-3"><div th:replace="~{fragments/layout :: flash}"></div><div class="page-heading d-flex flex-wrap justify-content-between align-items-end gap-3"><div><span class="eyebrow">Quản lý dữ liệu</span><h1 class="h2 mt-2">Từ khóa</h1><p class="text-muted-custom mb-0">Volume, mức cạnh tranh và Quality Score dùng trong mô phỏng.</p></div><a class="btn btn-primary" th:href="@{/keywords/new}">＋ Thêm từ khóa</a></div><form class="filter-bar row g-2 mb-3" method="get"><div class="col-md-7"><label class="form-label">Tìm từ khóa</label><input class="form-control" name="q" th:value="${q}" placeholder="Nhập cụm từ tìm kiếm"></div><div class="col-md-3"><label class="form-label">Trạng thái</label><select class="form-select" name="status"><option value="">Tất cả</option><option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Hoạt động</option><option value="PAUSED" th:selected="${status == 'PAUSED'}">Tạm dừng</option></select></div><div class="col-md-2 d-grid"><button class="btn btn-outline-primary">Lọc</button></div></form><div class="card"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Từ khóa</th><th>Lượt tìm kiếm</th><th>Cạnh tranh</th><th>Quality Score</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="k : ${items}"><td class="fw-semibold" th:text="${k.phrase}"></td><td th:text="${#numbers.formatInteger(k.searchVolume,1,'COMMA')}"></td><td th:text="${k.competition == 'HIGH' ? 'Cao' : (k.competition == 'LOW' ? 'Thấp' : 'Trung bình')}"></td><td><span class="badge badge-soft" th:text="${k.qualityScore} + '/10'"></span></td><td th:text="${k.status == 'ACTIVE' ? 'Hoạt động' : 'Tạm dừng'}"></td><td><div class="d-flex gap-1"><a class="btn btn-sm btn-outline-secondary" th:href="@{/keywords/{id}(id=${k.id})}">Xem</a><a class="btn btn-sm btn-outline-primary" th:href="@{/keywords/{id}/edit(id=${k.id})}">Sửa</a><form th:action="@{/keywords/{id}/delete(id=${k.id})}" method="post" data-confirm="Xóa từ khóa này? Từ khóa đang được dùng sẽ không thể xóa."><button class="btn btn-sm btn-outline-danger">Xóa</button></form></div></td></tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="6" class="empty-state">Chưa có từ khóa phù hợp.</td></tr></tbody></table></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
