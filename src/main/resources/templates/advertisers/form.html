<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${pageTitle})}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container page-wrap py-3"><div class="page-heading"><span class="eyebrow">Nhà quảng cáo</span><h1 class="h2 mt-2" th:text="${pageTitle}"></h1></div><form th:action="@{/advertisers}" th:object="${form}" method="post" class="card p-3 p-md-4"><input type="hidden" name="id" th:value="${id}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Tên nhà quảng cáo *</label><input class="form-control" th:field="*{name}" required><div class="text-danger small" th:errors="*{name}"></div></div><div class="col-md-6"><label class="form-label">Công ty</label><input class="form-control" th:field="*{company}"></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" th:field="*{email}"><div class="text-danger small" th:errors="*{email}"></div></div><div class="col-md-6"><label class="form-label">Điện thoại</label><input class="form-control" th:field="*{phone}"></div><div class="col-md-6"><label class="form-label">Ngân sách (VNĐ)</label><input class="form-control" type="number" min="0" step="1000" th:field="*{budget}"><div class="text-danger small" th:errors="*{budget}"></div></div><div class="col-md-6"><label class="form-label">Trạng thái</label><select class="form-select" th:field="*{status}"><option value="ACTIVE">Hoạt động</option><option value="PAUSED">Tạm dừng</option></select></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Lưu thông tin</button><a class="btn btn-outline-secondary" th:href="@{/advertisers}">Hủy</a></div></form></main><footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
