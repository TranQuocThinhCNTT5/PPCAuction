<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Nhà quảng cáo')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container page-wrap py-3"><div th:replace="~{fragments/layout :: flash}"></div><div class="page-heading d-flex flex-wrap justify-content-between align-items-end gap-3"><div><span class="eyebrow">Quản lý dữ liệu</span><h1 class="h2 mt-2">Nhà quảng cáo</h1><p class="text-muted-custom mb-0">Quản lý thông tin và ngân sách mô phỏng.</p></div><a class="btn btn-primary" th:href="@{/advertisers/new}">＋ Thêm nhà quảng cáo</a></div><form class="filter-bar row g-2 mb-3" method="get"><div class="col-md-9"><label class="form-label">Tìm theo tên hoặc công ty</label><input class="form-control" name="q" th:value="${q}" placeholder="Ví dụ: Alpha Digital"></div><div class="col-md-3 d-grid"><button class="btn btn-outline-primary">Tìm kiếm</button></div></form><div class="card"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Tên</th><th>Công ty</th><th>Email</th><th>Điện thoại</th><th>Ngân sách</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="a : ${items}"><td class="fw-semibold" th:text="${a.name}"></td><td th:text="${a.company}"></td><td th:text="${a.email}"></td><td th:text="${a.phone}"></td><td th:text="${#numbers.formatDecimal(a.budget,1,'POINT',0,'COMMA')} + ' ₫'"></td><td><span class="badge" th:classappend="${a.status == 'ACTIVE'} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${a.status == 'ACTIVE' ? 'Hoạt động' : 'Tạm dừng'}"></span></td><td><div class="d-flex gap-1"><a class="btn btn-sm btn-outline-secondary" th:href="@{/advertisers/{id}(id=${a.id})}">Xem</a><a class="btn btn-sm btn-outline-primary" th:href="@{/advertisers/{id}/edit(id=${a.id})}">Sửa</a><form th:action="@{/advertisers/{id}/delete(id=${a.id})}" method="post" data-confirm="Xóa nhà quảng cáo này? Thao tác chỉ thành công khi không còn dữ liệu liên quan."><button class="btn btn-sm btn-outline-danger">Xóa</button></form></div></td></tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="7" class="empty-state">Chưa có nhà quảng cáo phù hợp.</td></tr></tbody></table></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
