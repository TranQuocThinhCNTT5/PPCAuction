<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Chi tiết nhà quảng cáo')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container page-wrap py-3"><div class="page-heading d-flex justify-content-between align-items-end"><div><span class="eyebrow">Hồ sơ</span><h1 class="h2 mt-2" th:text="${item.name}"></h1></div><a class="btn btn-outline-primary" th:href="@{/advertisers/{id}/edit(id=${item.id})}">Sửa thông tin</a></div><div class="card p-4"><dl class="row mb-0"><dt class="col-sm-3">Công ty</dt><dd class="col-sm-9" th:text="${item.company ?: '—'}"></dd><dt class="col-sm-3">Email</dt><dd class="col-sm-9" th:text="${item.email ?: '—'}"></dd><dt class="col-sm-3">Điện thoại</dt><dd class="col-sm-9" th:text="${item.phone ?: '—'}"></dd><dt class="col-sm-3">Ngân sách</dt><dd class="col-sm-9" th:text="${#numbers.formatDecimal(item.budget,1,'POINT',0,'COMMA')} + ' ₫'"></dd><dt class="col-sm-3">Trạng thái</dt><dd class="col-sm-9" th:text="${item.status == 'ACTIVE' ? 'Hoạt động' : 'Tạm dừng'}"></dd></dl></div><a class="btn btn-link mt-3" th:href="@{/advertisers}">← Danh sách nhà quảng cáo</a></main><footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
