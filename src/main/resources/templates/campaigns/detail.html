<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Chi tiết chiến dịch')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container page-wrap py-3"><div class="page-heading d-flex flex-wrap justify-content-between align-items-end gap-3"><div><span class="eyebrow">Chiến dịch</span><h1 class="h2 mt-2" th:text="${item.name}"></h1></div><div class="d-flex gap-2"><a class="btn btn-outline-primary" th:href="@{/campaigns/{id}/edit(id=${item.id})}">Sửa</a><a class="btn btn-primary" th:href="@{/campaign-simulator(campaignId=${item.id})}">Mô phỏng</a></div></div><div class="row g-3"><div class="col-lg-6"><div class="card p-4 h-100"><dl class="row mb-0"><dt class="col-sm-5">Nhà quảng cáo</dt><dd class="col-sm-7" th:text="${item.advertiser.name}"></dd><dt class="col-sm-5">Ngân sách</dt><dd class="col-sm-7" th:text="${#numbers.formatDecimal(item.budget,1,'POINT',0,'COMMA')} + ' ₫'"></dd><dt class="col-sm-5">Ngân sách/ngày</dt><dd class="col-sm-7" th:text="${#numbers.formatDecimal(item.dailyBudget,1,'POINT',0,'COMMA')} + ' ₫'"></dd><dt class="col-sm-5">Bắt đầu</dt><dd class="col-sm-7" th:text="${item.startDate}"></dd><dt class="col-sm-5">Kết thúc</dt><dd class="col-sm-7" th:text="${item.endDate}"></dd><dt class="col-sm-5">Trạng thái</dt><dd class="col-sm-7" th:text="${item.status == 'ACTIVE' ? 'Hoạt động' : 'Tạm dừng'}"></dd><dt class="col-sm-5">Mô tả</dt><dd class="col-sm-7" th:text="${item.description ?: '—'}"></dd></dl></div></div><div class="col-lg-6"><div class="card p-4 h-100"><h2 class="h5">Từ khóa trong chiến dịch</h2><div th:if="${#lists.isEmpty(item.keywordSettings)}" class="empty-state">Chưa chọn từ khóa.</div><div class="table-responsive" th:if="${!#lists.isEmpty(item.keywordSettings)}"><table class="table mb-0"><thead><tr><th>Từ khóa</th><th>Bid</th><th>QS</th><th>CTR dự kiến</th></tr></thead><tbody><tr th:each="s : ${item.keywordSettings}"><td th:text="${s.keyword.phrase}"></td><td th:text="${s.bid}"></td><td th:text="${s.qualityScore}"></td><td th:text="${s.expectedCtr} + '%'"></td></tr></tbody></table></div></div></div></div><a class="btn btn-link mt-3" th:href="@{/campaigns}">← Danh sách chiến dịch</a></main><footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
