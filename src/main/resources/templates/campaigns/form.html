<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${pageTitle})}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container page-wrap py-3"><div class="page-heading"><span class="eyebrow">Chiến dịch</span><h1 class="h2 mt-2" th:text="${pageTitle}"></h1></div><form th:action="@{/campaigns}" th:object="${form}" method="post" class="card p-3 p-md-4"><input type="hidden" name="id" th:value="${id}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Tên chiến dịch *</label><input class="form-control" th:field="*{name}" required><div class="text-danger small" th:errors="*{name}"></div></div><div class="col-md-6"><label class="form-label">Nhà quảng cáo *</label><select class="form-select" th:field="*{advertiserId}" required><option value="">Chọn nhà quảng cáo</option><option th:each="a : ${advertisers}" th:value="${a.id}" th:text="${a.name}"></option></select><div class="text-danger small" th:errors="*{advertiserId}"></div></div><div class="col-md-6"><label class="form-label">Ngân sách toàn chiến dịch (VNĐ)</label><input class="form-control" type="number" min="0" step="1000" th:field="*{budget}"><div class="text-danger small" th:errors="*{budget}"></div></div><div class="col-md-6"><label class="form-label">Ngân sách mỗi ngày (VNĐ)</label><input class="form-control" type="number" min="0" step="1000" th:field="*{dailyBudget}"><div class="text-danger small" th:errors="*{dailyBudget}"></div></div><div class="col-md-6"><label class="form-label">Ngày bắt đầu</label><input class="form-control" type="date" th:field="*{startDate}"></div><div class="col-md-6"><label class="form-label">Ngày kết thúc</label><input class="form-control" type="date" th:field="*{endDate}"><div class="text-danger small" th:errors="*{endDate}"></div></div><div class="col-md-6"><label class="form-label">Trạng thái</label><select class="form-select" th:field="*{status}"><option value="ACTIVE">Hoạt động</option><option value="PAUSED">Tạm dừng</option></select></div><div class="col-12"><label class="form-label">Mô tả</label><textarea class="form-control" rows="3" th:field="*{description}"></textarea></div><div class="col-12"><label class="form-label">Từ khóa chiến dịch</label><div class="row g-2"><div class="col-sm-6 col-lg-4" th:each="k : ${keywords}"><label class="border rounded-3 p-3 w-100 d-flex gap-2 align-items-center"><input class="form-check-input mt-0" type="checkbox" th:field="*{keywordIds}" th:value="${k.id}"><span><strong th:text="${k.phrase}"></strong><small class="d-block text-muted-custom">Volume <span th:text="${k.searchVolume}"></span> · QS <span th:text="${k.qualityScore}"></span></small></span></label></div></div><small class="text-muted-custom">Từ khóa mới dùng bid mặc định 1.00 VNĐ trong mô phỏng chiến dịch; trang Đấu giá cho phép nhập bid riêng cho từng phiên.</small></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Lưu chiến dịch</button><a class="btn btn-outline-secondary" th:href="@{/campaigns}">Hủy</a></div></form></main><footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
