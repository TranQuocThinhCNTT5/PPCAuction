<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Chiến dịch')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container page-wrap py-3"><div th:replace="~{fragments/layout :: flash}"></div><div class="page-heading d-flex flex-wrap justify-content-between align-items-end gap-3"><div><span class="eyebrow">Quản lý dữ liệu</span><h1 class="h2 mt-2">Chiến dịch</h1><p class="text-muted-custom mb-0">Ngân sách, thời hạn và bộ từ khóa tham gia.</p></div><a class="btn btn-primary" th:href="@{/campaigns/new}">＋ Thêm chiến dịch</a></div><form class="filter-bar row g-2 mb-3" method="get"><div class="col-md-7"><label class="form-label">Tên chiến dịch</label><input class="form-control" name="q" th:value="${q}" placeholder="Tìm chiến dịch"></div><div class="col-md-3"><label class="form-label">Trạng thái</label><select class="form-select" name="status"><option value="">Tất cả</option><option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Hoạt động</option><option value="PAUSED" th:selected="${status == 'PAUSED'}">Tạm dừng</option></select></div><div class="col-md-2 d-grid"><button class="btn btn-outline-primary">Lọc</button></div></form><div class="card"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Chiến dịch</th><th>Nhà quảng cáo</th><th>Ngân sách</th><th>Ngân sách/ngày</th><th>Khoảng thời gian</th><th>Từ khóa</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="c : ${items}"><td class="fw-semibold" th:text="${c.name}"></td><td th:text="${c.advertiser.name}"></td><td th:text="${#numbers.formatDecimal(c.budget,1,'POINT',0,'COMMA')} + ' ₫'"></td><td th:text="${#numbers.formatDecimal(c.dailyBudget,1,'POINT',0,'COMMA')} + ' ₫'"></td><td th:text="${c.startDate + ' – ' + c.endDate}"></td><td th:text="${c.keywordSettings.size()}"></td><td th:text="${c.status == 'ACTIVE' ? 'Hoạt động' : 'Tạm dừng'}"></td><td><div class="d-flex gap-1"><a class="btn btn-sm btn-outline-secondary" th:href="@{/campaigns/{id}(id=${c.id})}">Xem</a><a class="btn btn-sm btn-outline-primary" th:href="@{/campaigns/{id}/edit(id=${c.id})}">Sửa</a><form th:action="@{/campaigns/{id}/delete(id=${c.id})}" method="post" data-confirm="Xóa chiến dịch này? Chiến dịch có lịch sử mô phỏng sẽ được giữ lại."><button class="btn btn-sm btn-outline-danger">Xóa</button></form></div></td></tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="8" class="empty-state">Chưa có chiến dịch phù hợp.</td></tr></tbody></table></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
