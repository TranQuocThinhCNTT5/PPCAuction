spring.application.name=PPCAuction

# SQL Server Express connection. Override DB_URL when using a custom JDBC URL.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost;instanceName=SQLEXPRESS01;databaseName=ppc_auction_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Add missing tables/columns for the simulator while retaining existing rows and objects.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
server.error.include-message=never
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false
